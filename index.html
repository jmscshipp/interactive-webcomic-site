<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="title">
      <p class="title-text">Maia and James' amazing webcomic</p>
    </div>
    <div class="header">
      <div class="site-button-container">
        <button id="home-button" class="site-button">home</button>
        <button id="about-button" class="site-button">about</button>
        <button id="archive-button" class="site-button">archive</button>
      </div>
    </div>
    <div id="comic-view" class="center-vertically">
      <div class="nav-button-container">
        <button class="nav-button first">first</button>
        <button class="nav-button prev">prev</button>
        <button class="nav-button next">next</button>
        <button class="nav-button latest">latest</button>
      </div>
      <div class="page">
        <img class="comic-image" src="pages/01.png" />
      </div>
      <div class="nav-button-container">
        <button class="nav-button first">first</button>
        <button class="nav-button prev">prev</button>
        <button class="nav-button next">next</button>
        <button class="nav-button latest">latest</button>
      </div>
      <div class="footer">
        <div class="information">
          <p>information area</p>
          <p>maybe we'd put some little notes here</p>
        </div>
      </div>
    </div>
    <div id="about-view" class="center-vertically disabled">
      <p>test text that talks about us...</p>
    </div>
    <div id="archive-view" class="center-vertically disabled">
      <button>it's a button</button>
    </div>
  </body>
  <script type="module" src="script.js"></script>
</html>
